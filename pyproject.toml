[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fsla-devtools"
version = "0.1.0"
description = "The development tools every FSLA repository shares: the commit and push content checks, the cell registry, the interleaving driver, the measurement build system and the results store's code"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Blake Bottum" }]
# No dependencies: the standard library only, so every repository's venv, CI job and container can carry it.
dependencies = []

[tool.setuptools.packages.find]
include = ["fsla_devtools*"]

[tool.setuptools.package-data]
# the central cell registry's records
"fsla_devtools.cells" = ["*.json"]
# the results index's views
"fsla_devtools.results" = ["views/*.sql"]

[tool.ruff]
line-length = 127
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I", "C4"]
